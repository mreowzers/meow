  <script>

  const container = document.getElementById('pacman-container');
  const openSVG   = container.querySelector('svg.open');
  const closedSVG = container.querySelector('svg.closed');

  // Keep track of viewport size
  let W = window.innerWidth,
      H = window.innerHeight;
  window.addEventListener('resize', () => {
    W = window.innerWidth;
    H = window.innerHeight;
  });

  // Pac‑Man state
  const pacman = {
    x: W / 2,
    y: H / 2,
    r: 32,
    speed: 3,
    dir: { x: 1, y: 0 }
  };

  // Pills state
  let pills   = [];
  let isEating = false;

  /**
   * Spawns a single moving pill at a random location.
   */
  function spawnPill () {
    const p = document.createElement('div');
    p.className   = 'pill';
    p.textContent = '💊';
    p.style.color = '#1E90FF';

    // Custom properties (not CSS)
    p.x  = Math.random() * W;
    p.y  = Math.random() * H;
    p.vx = (Math.random() - 0.5) * 2; // random velocity
    p.vy = (Math.random() - 0.5) * 2;

    document.getElementById('game-area').appendChild(p);
    pills.push(p);
  }

  // Initial pills
  for (let i = 0; i < 15; i++) spawnPill();
  // Respawn pills occasionally so there are always at least 5
  setInterval(() => { if (pills.length < 5) spawnPill(); }, 3000);

  /**
   * Handles the moment Pac‑Man eats a pill.
   */
  function handleEat (pill) {
    isEating = true;
    pill.remove();
    pills = pills.filter(x => x !== pill);
    spawnPill();

    // Keep Pac‑Man closed for a short bite animation
    setTimeout(() => { isEating = false; }, 150);
  }

  /**
   * The main animation/game loop (executed every frame).
   */
  function update () {
    // 1️⃣ Move pills
    pills.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      // Bounce on edges
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      // Apply position to DOM element
      p.style.left = p.x + 'px';
      p.style.top  = p.y + 'px';
    });

    // 2️⃣ Find nearest pill
    let nearest = null,
        minDist = Infinity;
    pills.forEach(p => {
      const dx = p.x - pacman.x,
            dy = p.y - pacman.y,
            d  = Math.hypot(dx, dy);
      if (d < minDist) {
        minDist = d;
        nearest = p;
      }
    });

    // 3️⃣ Eat if close enough
    if (!isEating && nearest && minDist < pacman.r) {
      handleEat(nearest);
    }

    // 4️⃣ Adjust Pac‑Man direction toward nearest pill
    if (nearest) {
      const dx = nearest.x - pacman.x,
            dy = nearest.y - pacman.y,
            d  = Math.hypot(dx, dy);
      pacman.dir.x = dx / d;
      pacman.dir.y = dy / d;
    }

    // 5️⃣ Move Pac‑Man
    pacman.x += pacman.dir.x * pacman.speed;
    pacman.y += pacman.dir.y * pacman.speed;

    // Wrap around screen
    if (pacman.x < -pacman.r)         pacman.x = W + pacman.r;
    else if (pacman.x > W + pacman.r) pacman.x = -pacman.r;
    if (pacman.y < -pacman.r)         pacman.y = H + pacman.r;
    else if (pacman.y > H + pacman.r) pacman.y = -pacman.r;

    // 6️⃣ Render Pac‑Man position & angle
    const angle = Math.atan2(pacman.dir.y, pacman.dir.x); // radians
    container.style.transform = `translate(${pacman.x - 32}px, ${pacman.y - 32}px) rotate(${angle}rad)`;

    // 7️⃣ Toggle open/closed mouth based on eating state
    openSVG.style.display   = isEating ? 'none'  : 'block';
    closedSVG.style.display = isEating ? 'block' : 'none';

    // 8️⃣ Next frame
    requestAnimationFrame(update);
  }

  // Kick off the loop
  requestAnimationFrame(update);
  </script>
